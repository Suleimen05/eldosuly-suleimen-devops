services:
  jenkins:
    build: .
    image: eldosuly-suleimen-jenkins
    container_name: eldosuly-suleimen-jenkins
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_USER: admin
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro

volumes:
  jenkins_home:
